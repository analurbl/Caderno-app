<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioética em Casos</title>
<meta name="description" content="Leia o QR code, analise o caso e diga quais princípios da bioética foram respeitados ou feridos.">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1f24; --muted: #5d6470; --line: #e2ded4;
    --accent: #2f6f5e; --accent-ink: #ffffff; --ok: #1f7a4a; --ok-bg: #e5f4ea;
    --bad: #b3362d; --bad-bg: #fbe8e6; --warn-bg: #fff4dc; --chip: #efebe2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b; --card: #1e2126; --ink: #eceae5; --muted: #a2a8b2; --line: #30343b;
      --accent: #5bb39a; --accent-ink: #0d1512; --ok: #6fd39c; --ok-bg: #18301f;
      --bad: #f08b80; --bad-bg: #3a1d1a; --warn-bg: #33291a; --chip: #2a2e34;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
  a { color: var(--accent); }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 8px 0 4px; }
  h2 { font-size: 1.2rem; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 14px 0; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .9rem; }
  .top a { text-decoration: none; }
  .principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .principles div { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
  .principles b { display: block; }
  .case-list { list-style: none; padding: 0; margin: 0; }
  .case-list a { display: block; padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .case-list a:last-child { border-bottom: 0; }
  .case-list small { color: var(--muted); display: block; }
  .tag { display: inline-block; font-size: .78rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--accent); }
  .story p { margin: 0 0 10px; }
  fieldset { border: 0; margin: 0; padding: 14px 0; border-top: 1px solid var(--line); }
  fieldset:first-of-type { border-top: 0; padding-top: 0; }
  legend { font-weight: 700; padding: 0; margin-bottom: 8px; float: left; width: 100%; }
  legend + * { clear: both; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; }
  .seg span { display: block; text-align: center; padding: 10px 4px; border: 1px solid var(--line); border-radius: 10px;
    font-size: .9rem; cursor: pointer; user-select: none; background: var(--card); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .seg input:disabled + span { cursor: default; }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font: inherit; background: var(--card); color: var(--ink); resize: vertical; }
  button, .btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary, .btn.secondary { background: var(--chip); color: var(--ink); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .fb { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: .94rem; }
  .fb.ok { background: var(--ok-bg); }
  .fb.bad { background: var(--bad-bg); }
  .fb strong.ok { color: var(--ok); } .fb strong.bad { color: var(--bad); }
  .score { font-size: 1.15rem; font-weight: 700; }
  .note { background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
  .err { color: var(--bad); font-size: .92rem; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .qr-card { background: #fff; color: #111; border: 1px solid #ddd; border-radius: 12px; padding: 14px; text-align: center; break-inside: avoid; }
  .qr-card svg { width: 100%; max-width: 200px; height: auto; display: block; margin: 8px auto; }
  .qr-card .url { font-size: .7rem; word-break: break-all; color: #555; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1 1 240px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--card); color: var(--ink); }
  .small { font-size: .88rem; }
  .hero { border-color: var(--accent); }
  .lbl { display: block; font-weight: 600; margin: 10px 0 6px; }
  .inp { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--card); color: var(--ink); }
  .inp[readonly] { background: var(--chip); }
  .bar { height: 6px; background: var(--chip); border-radius: 99px; margin: 8px 0 14px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .rank li:last-child { border-bottom: 0; }
  .rank li:nth-child(-n+3) .pos { color: var(--accent); }
  .rank li.me { background: var(--ok-bg); border-radius: 10px; }
  .rank .pos { font-weight: 800; font-size: 1.1rem; text-align: center; font-variant-numeric: tabular-nums; }
  .rank .who { min-width: 0; overflow-wrap: anywhere; }
  .rank .who small { display: block; color: var(--muted); }
  .rank .who em { color: var(--muted); font-style: normal; font-size: .85rem; }
  .rank .pts { font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .rank .pts small { font-size: .7rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .resumo { list-style: none; margin: 0 0 12px; padding: 0; }
  .resumo li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .resumo li span { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--bad); }
  .resumo li span.ok { color: var(--ok); }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .row-between h2 { margin: 0; }
  .small-btn { padding: 8px 12px; font-size: .88rem; }
  .qr-main { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 18px; }
  .qr-main .big svg { max-width: 320px; }
  .sec { margin-top: 22px; }
  @media (max-width: 560px) { .qr-main { grid-template-columns: 1fr; } }
  @media print {
    body { background: #fff; } .no-print { display: none !important; }
    main { max-width: none; padding: 0; } .qr-grid { grid-template-columns: repeat(3, 1fr); } .qr-main { page-break-after: always; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="qrcode.js"></script>
<script src="config.js"></script>
<script src="casos.js"></script>
<script src="app.js"></script>
</body>
</html>
